<svg width="260" height="300" viewBox="0 0 260 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="130" cy="130" r="120" fill="#0A1A2F" stroke="#00D1FF" stroke-width="6"/>

  <!-- AI Chip -->
  <rect x="70" y="70" width="120" height="120" rx="16" 
        fill="#112B45" stroke="#00D1FF" stroke-width="4"/>

  <!-- Chip pins -->
  <g stroke="#00D1FF" stroke-width="4">
    <line x1="100" y1="60" x2="100" y2="70"/>
    <line x1="130" y1="60" x2="130" y2="70"/>
    <line x1="160" y1="60" x2="160" y2="70"/>

    <line x1="100" y1="190" x2="100" y2="200"/>
    <line x1="130" y1="190" x2="130" y2="200"/>
    <line x1="160" y1="190" x2="160" y2="200"/>

    <line x1="60" y1="100" x2="70" y2="100"/>
    <line x1="60" y1="130" x2="70" y2="130"/>
    <line x1="60" y1="160" x2="70" y2="160"/>

    <line x1="190" y1="100" x2="200" y2="100"/>
    <line x1="190" y1="130" x2="200" y2="130"/>
    <line x1="190" y1="160" x2="200" y2="160"/>
  </g>

  <!-- Database cylinder -->
  <ellipse cx="130" cy="110" rx="38" ry="16" fill="#00D1FF" opacity="0.9"/>
  <rect x="92" y="110" width="76" height="55" fill="#00D1FF" opacity="0.9"/>
  <ellipse cx="130" cy="165" rx="38" ry="16" fill="#00D1FF" opacity="0.9"/>

  <!-- Neural lines -->
  <g stroke="#00D1FF" stroke-width="3" opacity="0.7">
    <line x1="130" y1="50" x2="130" y2="20"/>
    <line x1="210" y1="130" x2="240" y2="130"/>
    <line x1="130" y1="240" x2="130" y2="210"/>
    <line x1="20" y1="130" x2="50" y2="130"/>
  </g>

  <!-- Text (moved down for spacing) -->
  <text x="130" y="285" font-family="Segoe UI, sans-serif" font-size="22" 
        fill="#00D1FF" text-anchor="middle">
    AWR RAG Analyzer
  </text>
</svg>
